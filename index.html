<style>
  :root {
    --teal: #48aeb3;
    --teal-bright: #00b6bd;
    --yellow: #fcbb15;
    --pink: #e62254;
    --blue: #3e8ef1;
    --green: #9ac724;
    --purple: #6313cc;
    --orange: #f39918;
    --ink: #1c1c1c;
    --paper: #ffffff;
    --font-display: 'Press Start 2P', 'Courier New', monospace;
    --font-body: 'Nunito', system-ui, -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    width: 100%;
    overflow-x: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.55;
  }

  img { max-width: 100%; display: block; }

  .wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px;
  }

  h1, h2, h3 {
    font-family: var(--font-display);
    line-height: 1.4;
    text-wrap: balance;
  }

  h1 { font-size: clamp(1.7rem, 4.2vw, 3rem); }
  h2 { font-size: clamp(1.3rem, 3vw, 2.1rem); }
  h3 { font-size: clamp(1rem, 1.6vw, 1.05rem); }

  p { max-width: 62ch; }

  ul { list-style: none; }

  a { color: inherit; }

  .eyebrow {
    font-family: var(--font-display);
    font-size: 0.7rem;
    letter-spacing: 0.04em;
  }

  /* pixel-stepped corners, reused on buttons, cards and windows */
  .btn, .card, .card-inner, .faq-card {
    clip-path: polygon(
      0 20px, 5px 20px, 5px 15px, 10px 15px, 10px 10px, 15px 10px, 15px 5px, 20px 5px, 20px 0,
      calc(100% - 20px) 0, calc(100% - 15px) 0, calc(100% - 15px) 5px, calc(100% - 10px) 5px, calc(100% - 10px) 10px, calc(100% - 5px) 10px, calc(100% - 5px) 15px, 100% 15px, 100% 20px,
      100% calc(100% - 20px), 100% calc(100% - 15px), calc(100% - 5px) calc(100% - 15px), calc(100% - 5px) calc(100% - 10px), calc(100% - 10px) calc(100% - 10px), calc(100% - 10px) calc(100% - 5px), calc(100% - 15px) calc(100% - 5px), calc(100% - 15px) 100%, calc(100% - 20px) 100%,
      20px 100%, 15px 100%, 15px calc(100% - 5px), 10px calc(100% - 5px), 10px calc(100% - 10px), 5px calc(100% - 10px), 5px calc(100% - 15px), 0 calc(100% - 15px), 0 calc(100% - 20px)
    );
  }

  .btn {
    display: inline-block;
    font-family: var(--font-display);
    font-size: clamp(0.9rem, 1.6vw, 0.95rem);
    line-height: 1.6;
    color: var(--ink);
    background: var(--yellow);
    border: 3px solid var(--ink);
    padding: 16px 28px;
    box-shadow: 7px 7px 0 var(--ink);
    text-decoration: none;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:hover { transform: translate(2px, 2px); box-shadow: 5px 5px 0 var(--ink); }
  .btn:active { transform: translate(7px, 7px); box-shadow: 0 0 0 var(--ink); }

  /* ---------- header / hero ---------- */
  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .hero-full {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ---------- sections 2-7: image sections ---------- */
  .img-section { padding: 0; }
  .section-image {
    display: block;
    width: 100%;
    height: auto;
  }

  footer {
    padding: 40px 24px 56px;
    text-align: center;
    font-size: 0.85rem;
    color: #666;
  }

<body>

<header class="hero">
  <h1 class="visually-hidden">Relatórios de Desempenho Bebras 2026 — Resultados que viram decisões pedagógicas</h1>
  <img class="hero-full" src="assets/hero-full.png" alt="Relatórios de Desempenho Bebras 2026. Resultados que viram decisões pedagógicas. Planeje os próximos passos com a ajuda dos Relatórios de Desempenho do Bebras. Inscreva sua escola na Olimpíada Bebras.">
</header>

<section class="img-section" id="mais-que-classificacao">
  <img class="section-image" src="assets/section-2.png" alt="Muito mais do que uma classificação. O Bebras reúne uma das maiores bases de dados sobre o desempenho em Pensamento Computacional na Educação Básica brasileira. Os Relatórios organizam esses dados para revelar pontos fortes, oportunidades de desenvolvimento e diferenças entre níveis e grupos de estudantes. A Olimpíada termina, os dados continuam apoiando a aprendizagem.">
</section>

<section class="img-section" id="o-que-mostra">
  <img class="section-image" src="assets/section-3.png" alt="O que os Relatórios de Desempenho mostram? Comparação nacional, desempenho por nível, faixas de pontuação, desempenho por dificuldade. Análise das cinco habilidades: decomposição, abstração, reconhecimento de padrões, pensamento algorítmico e avaliação.">
</section>

<section class="img-section" id="como-ajuda">
  <img class="section-image" src="assets/section-4.png" alt="Como os dados podem ajudar sua escola? Coordenação, Direção, Professores e Escola. Dos resultados às ações: informações claras para apoiar toda a equipe escolar.">
</section>

<section class="img-section" id="mais-informacoes">
  <img class="section-image" src="assets/section-5.png" alt="Mais informações sem aplicar outra prova. Os indicadores são gerados pela própria participação dos estudantes na Olimpíada Bebras. Os Relatórios não substituem as avaliações da escola. Eles complementam as informações existentes com uma análise específica das habilidades de Pensamento Computacional.">
</section>

<section class="img-section" id="caminho-pratico">
  <img class="section-image" src="assets/section-6.png" alt="Um caminho prático para começar a implementar a Computação na escola. A Computação na Educação Básica está organizada em três eixos: Mundo Digital, Cultura Digital e Pensamento Computacional. A Olimpíada Bebras atua diretamente no eixo de Pensamento Computacional.">
</section>

<section class="img-section" id="duvidas">
  <img class="section-image" src="assets/section-7.png" alt="Tire suas dúvidas. É necessário aplicar outra avaliação? Não. Os Relatórios são gerados pelo Bebras Experience? Não. A comparação considera todas as escolas brasileiras? Os Relatórios substituem as avaliações da escola? Não. Os Relatórios apresentam resultados individuais?">
</section>
