<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios de Desempenho Bebras 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; overflow-x: hidden; background: #ffffff; }
  .lp { display: flex; flex-direction: column; width: 100%; max-width: 1920px; margin: 0 auto; }
  .bloco { width: 100%; }
  .bloco .frame { position: relative; width: 100%; line-height: 0; }
  .bloco img { display: block; width: 100%; height: auto; }
  #mais-que-classificacao { background: #48aeb3; }
  #mais-informacoes { background: #fcbb15; }
  @media (min-width: 768px) {
    .bloco:not(#hero) .frame { width: 88%; max-width: 1680px; margin: 0 auto; }
  }
  .cta-link {
    position: absolute;
    left: 8%;
    top: 70.5%;
    width: 24%;
    height: 9%;
    display: block;
    cursor: pointer;
  }
</style>
</head>
<body>
  <main class="lp">
    <section class="bloco" id="hero">
      <div class="frame">
        <img src="assets/bloco-01.png" alt="Relatórios de Desempenho Bebras 2026 — Transforme os resultados da Olimpíada Bebras em decisões pedagógicas para sua escola">
        <a class="cta-link" href="https://gestao.upmat.com.br/sign-in?code=Bebras26%20%7C%20type" aria-label="Inscreva sua escola na Olimpíada Bebras"></a>
      </div>
    </section>

    <section class="bloco" id="mais-que-classificacao">
      <div class="frame">
        <img src="assets/bloco-02.png" alt="Muito mais do que uma classificação">
      </div>
    </section>

    <section class="bloco" id="o-que-mostra">
      <div class="frame">
        <img src="assets/bloco-03.png" alt="O que os relatórios de desempenho mostram">
      </div>
    </section>

    <section class="bloco" id="como-ajuda">
      <div class="frame">
        <img src="assets/bloco-04.png" alt="Como os dados podem ajudar sua escola">
      </div>
    </section>

    <section class="bloco" id="mais-informacoes">
      <div class="frame">
        <img src="assets/bloco-05.png" alt="Mais informações sem aplicar outra prova">
      </div>
    </section>

    <section class="bloco" id="caminho-pratico">
      <div class="frame">
        <img src="assets/bloco-06.png" alt="Um caminho prático para começar a implementar a computação na escola">
      </div>
    </section>

    <section class="bloco" id="duvidas">
      <div class="frame">
        <img src="assets/bloco-07.png" alt="Tire suas dúvidas">
      </div>
    </section>

    <div id="inscricao"></div>
  </main>
</body>
</html>
